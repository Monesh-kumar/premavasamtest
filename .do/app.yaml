name: premavasam-web
region: blr
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    build_command: npm ci --omit=dev
    run_command: node server.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGIN
        value: "https://premavasam.org"
      - key: ADMIN_USER
        value: "admin"
      - key: ADMIN_PASSWORD
        type: SECRET
        value: "ChangeThisPassphrase2026!"
      - key: DB_PATH
        value: "/app/data/database.sqlite"
      - key: BACKUP_DIR
        value: "/app/data/backups"
    volumes:
      - name: premavasam-db-data
        mount_path: /app/data
        size: 1GiB
